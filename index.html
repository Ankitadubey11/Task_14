<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock, Paper, Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <h1>Rock, Paper, Scissors</h1>
    <p class="subtitle">Choose your move to beat the computer!</p>

    <!-- Scoreboard -->
    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card user-card">
        <span class="label">You</span>
        <span id="user-score" class="score">0</span>
      </div>
      <div class="score-card comp-card">
        <span class="label">Computer</span>
        <span id="comp-score" class="score">0</span>
      </div>
    </section>

    <!-- Choice Buttons -->
    <section class="choices" aria-label="Game Choices">
      <button class="choice-btn" data-choice="rock" aria-label="Rock">
        <span class="emoji">🪨</span>
        <span class="name">Rock</span>
      </button>
      <button class="choice-btn" data-choice="paper" aria-label="Paper">
        <span class="emoji">📄</span>
        <span class="name">Paper</span>
      </button>
      <button class="choice-btn" data-choice="scissors" aria-label="Scissors">
        <span class="emoji">✂️</span>
        <span class="name">Scissors</span>
      </button>
    </section>

    <!-- Round Details & Result -->
    <section class="status-box" aria-live="polite">
      <div class="picks">
        <p>Your Choice: <strong id="user-choice">-</strong></p>
        <p>Computer Choice: <strong id="comp-choice">-</strong></p>
      </div>
      <div id="result-banner" class="result-banner neutral">
        Make your first move!
      </div>
      <p id="round-message" class="round-message">
        Rock beats Scissors, Scissors beats Paper, and Paper beats Rock.
      </p>
    </section>

    <!-- Restart Button -->
    <button id="restart-btn" class="restart-btn" type="button">
      🔄 Restart Game
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
